<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>Wallet · SaveWise</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="wallet">
<header class="top">
  <div class="wrap">
    <div class="hbar">
      <div class="brand"><i data-ic="logo" data-s="24"></i><span>SaveWise</span></div>
      <button class="ghost-btn" id="logoutBtn"><i data-ic="logout" data-s="18"></i><span>Sign out</span></button>
    </div>
    <p class="eyebrow">Flex Wallet</p>
    <h1 class="amount" id="flexBalance">$0.00</h1>
    <p class="sub">Available balance. Withdraw any time.</p>
    <div class="actions">
      <button class="btn btn-light" id="depBtn"><i data-ic="down" data-s="18"></i>Deposit</button>
      <button class="btn btn-outline" id="wdBtn"><i data-ic="up" data-s="18"></i>Withdraw</button>
    </div>
  </div>
</header>
<main class="container">
  <section class="card">
    <div class="card-head"><h2>Autosave</h2><button class="btn btn-soft btn-sm" id="newRule"><i data-ic="plus" data-s="16"></i>New rule</button></div>
    <div id="rules"></div>
  </section>
  <section class="card" id="history">
    <h2>Transaction history</h2>
    <div id="txList"></div>
  </section>
</main>
<nav id="nav" class="nav"></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
