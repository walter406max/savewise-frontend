<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>Home · SaveWise</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
<header class="top">
  <div class="wrap">
    <div class="hbar">
      <div class="brand"><i data-ic="logo" data-s="24"></i><span>SaveWise</span></div>
      <button class="ghost-btn" id="logoutBtn"><i data-ic="logout" data-s="18"></i><span>Sign out</span></button>
    </div>
    <p class="eyebrow">Total balance</p>
    <h1 class="amount" id="totalBalance">$0.00</h1>
    <div class="stats">
      <div class="stat"><span>Available</span><b id="stAvail">$0.00</b></div>
      <div class="stat"><span>Locked</span><b id="stLocked">$0.00</b></div>
      <div class="stat"><span>In goals</span><b id="stGoals">$0.00</b></div>
    </div>
    <div class="actions">
      <a class="btn btn-light" href="wallet.html"><i data-ic="plus" data-s="18"></i>Deposit</a>
      <a class="btn btn-outline" href="safelock.html"><i data-ic="lock" data-s="18"></i>Lock money</a>
    </div>
  </div>
</header>
<main class="container">
  <section class="card">
    <h2>Wallets</h2>
    <div id="wallets"></div>
  </section>
  <section class="card">
    <h2>Progress</h2>
    <div id="progress"></div>
  </section>
  <section class="card">
    <div class="card-head"><h2>Recent activity</h2><a href="wallet.html#history">View all</a></div>
    <div id="recentTx"></div>
  </section>
</main>
<nav id="nav" class="nav"></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
