<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081b4b">
<title>SaveWise - Home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">🐷 SaveWise</div>
      <div class="topright"><span id="hello" class="hello"></span><button class="icon-btn" id="logoutBtn">Log out</button></div>
    </div>
    <p class="hero-label">Total Balance</p>
    <h1 class="hero-amount" id="totalBalance">$0.00</h1>
    <div class="hero-chips">
      <div class="chip"><span>Interest earned</span><b id="totalInterest">$0.00</b></div>
      <div class="chip"><span>Ready to claim</span><b id="pendingInterest">$0.00</b></div>
    </div>
    <div class="hero-actions">
      <a class="btn btn-light" href="wallet.html">＋ Add money</a>
      <button class="btn btn-glass" id="claimBtn">✨ Claim Interest</button>
    </div>
  </div>
</header>
<main class="container">
  <section class="card">
    <h2>My wallets</h2>
    <div id="wallets"></div>
  </section>
  <section class="card">
    <h2>Progress</h2>
    <div id="progress"></div>
  </section>
  <section class="card">
    <div class="card-head"><h2>Recent transactions</h2><a href="wallet.html#history">See all</a></div>
    <div id="recentTx"></div>
  </section>
</main>
<nav id="nav" class="nav"></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
