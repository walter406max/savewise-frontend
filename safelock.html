<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>SafeLock · SaveWise</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="safelock">
<header class="top">
  <div class="wrap">
    <div class="hbar">
      <div class="brand"><i data-ic="logo" data-s="24"></i><span>SaveWise</span></div>
      <button class="ghost-btn" id="logoutBtn"><i data-ic="logout" data-s="18"></i><span>Sign out</span></button>
    </div>
    <p class="eyebrow">SafeLock</p>
    <h1 class="amount" id="lockTotal">$0.00</h1>
    <p class="sub" id="lockCount">0 active locks</p>
    <div class="actions one">
      <button class="btn btn-light" id="lockBtn"><i data-ic="lock" data-s="18"></i>Lock money</button>
    </div>
  </div>
</header>
<main class="container">
  <div id="lockList"></div>
  <section class="card" id="pastCard" style="display:none">
    <h2>Released locks</h2>
    <div id="pastList"></div>
  </section>
</main>
<nav id="nav" class="nav"></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
