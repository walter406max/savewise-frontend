<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081b4b">
<title>SaveWise - Goals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="goals">
<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">🐷 SaveWise</div>
      <div class="topright"><span id="hello" class="hello"></span><button class="icon-btn" id="logoutBtn">Log out</button></div>
    </div>
    <p class="hero-label">Target Savings</p>
    <h1 class="hero-amount" id="goalsTotal">$0.00</h1>
    <p class="hero-sub" id="goalsCount">0 goals</p>
    <div class="hero-actions one">
      <button class="btn btn-light" id="newGoal">＋ New goal</button>
    </div>
  </div>
</header>
<main class="container">
  <div id="goalList"></div>
</main>
<nav id="nav" class="nav"></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
