<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>Goals · SaveWise</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="goals">
<header class="top">
  <div class="wrap">
    <div class="hbar">
      <div class="brand"><i data-ic="logo" data-s="24"></i><span>SaveWise</span></div>
      <button class="ghost-btn" id="logoutBtn"><i data-ic="logout" data-s="18"></i><span>Sign out</span></button>
    </div>
    <p class="eyebrow">Target Savings</p>
    <h1 class="amount" id="goalsTotal">$0.00</h1>
    <p class="sub" id="goalsCount">0 goals</p>
    <div class="actions one">
      <button class="btn btn-light" id="newGoal"><i data-ic="plus" data-s="18"></i>New goal</button>
    </div>
  </div>
</header>
<main class="container">
  <div id="goalList"></div>
</main>
<nav id="nav" class="nav"></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
