<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>Sign in · SaveWise</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<header class="top">
  <div class="wrap">
    <div class="hbar"><div class="brand"><i data-ic="logo" data-s="24"></i><span>SaveWise</span></div></div>
    <h1 class="title">Welcome back</h1>
    <p class="sub">Sign in to manage your savings.</p>
  </div>
</header>
<main class="container">
  <section class="card">
    <div class="seg" id="authTabs">
      <button type="button" data-mode="login" class="on">Sign in</button>
      <button type="button" data-mode="register">Create account</button>
    </div>
    <form id="authForm" novalidate>
      <div id="nameField" style="display:none">
        <label class="lbl" for="full_name">Full name</label>
        <input class="input" id="full_name" type="text" autocomplete="name">
      </div>
      <label class="lbl" for="email">Email</label>
      <input class="input" id="email" type="email" inputmode="email" autocomplete="email">
      <label class="lbl" for="password">Password</label>
      <input class="input" id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters">
      <div class="form-err" id="authErr"></div>
      <button class="btn btn-primary" id="authSubmit" type="submit">Sign in</button>
    </form>
    <p class="small center" id="authHint" style="margin-top:10px"></p>
  </section>
  <p class="small center">Demo environment. Balances are simulated and no real money moves.</p>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
